name: Release

# Publie une Release contenant UNIQUEMENT les deux fichiers necessaires
# (le script + le lanceur), des qu'un tag de version est pousse.
#
#   git tag v1.0
#   git push origin v1.0
#
# -> cree/met a jour la Release "v1.0" avec l'asset "pennylane-outil.zip".

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # necessaire pour creer la Release et y attacher le zip

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Installer Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: Lancer les tests (bloque la release s'ils echouent)
        run: make test-all

      - name: Construire le zip (deux fichiers uniquement)
        run: |
          make zip
          echo "Contenu du zip :"
          unzip -l dist/pennylane-outil.zip

      - name: Publier la Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: dist/pennylane-outil.zip
          generate_release_notes: true
