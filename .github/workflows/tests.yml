name: Tests

# Lance la suite de tests unitaires a chaque push et pull request.
on:
  push:
  pull_request:

# Moindre privilege : ces jobs n'ont besoin que de lire le depot.
permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Lancer les tests (Python + JS)
        run: make test-all
