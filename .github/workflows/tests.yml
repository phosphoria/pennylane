name: Tests

# Lance la suite de tests unitaires a chaque push et pull request.
on:
  push:
  pull_request:

# Moindre privilege : ces jobs n'ont besoin que de lire le depot.
permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Installer Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: Lancer les tests (Python + JS)
        run: make test-all

      - name: Vérifier les types JSDoc (TypeScript)
        run: make typecheck
